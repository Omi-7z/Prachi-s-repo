<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karigar · Organisation</title>
<meta name="theme-color" content="#FBF7F0">
<meta name="robots" content="noindex">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="modulepreload" href="/vendor/preact.mjs">
<style>
  body { margin: 0; background: #FBF7F0; color: #241F2E; font-family: "Hanken Grotesk", system-ui, sans-serif; }
  .k-boot { max-width: 30rem; margin: 18vh auto 0; padding: 0 20px; text-align: center; }
  .k-boot h1 { font-size: 24px; font-weight: 600; margin: 0 0 10px; }
  .k-boot p { font-size: 16px; line-height: 1.6; color: #6F6880; margin: 0; }
  .k-login { max-width: 380px; margin: 12vh auto 0; padding: 28px 24px; background: #fff; border-radius: 24px; box-shadow: 0 1px 3px rgba(36,31,46,.05), 0 8px 24px rgba(36,31,46,.06); }
  .k-login h1 { font-size: 24px; font-weight: 600; margin: 0 0 4px; letter-spacing: -.01em; }
  .k-login p { margin: 0 0 20px; color: #6F6880; font-size: 14.5px; line-height: 1.6; }
  .k-login label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  .k-login input { width: 100%; box-sizing: border-box; background: #fff; border: 1.5px solid #EBE3D6; border-radius: 14px; font: inherit; font-size: 16px; padding: 12px 14px; outline: none; }
  .k-login input:focus { border-color: #6B3FA0; box-shadow: 0 0 0 4px #F1E9FA; }
  .k-login button { margin-top: 22px; width: 100%; min-height: 46px; background: #6B3FA0; color: #fff; border: 0; border-radius: 999px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  .k-login button:disabled { opacity: .6; }
  .k-login .k-switch { margin: 18px 0 0; text-align: center; font-size: 14px; }
  .k-login [data-error] { color: #A81C24; font-size: 13.5px; margin-top: 12px; min-height: 1em; }
</style>
</head>
<body data-mode="console">
<div id="app"><div class="k-boot"><p>Karigar</p></div></div>
<template id="login">
  <form class="k-login" autocomplete="on">
    <h1>Karigar</h1>
    <p>Sign in with your organisation account.</p>
    <label for="k-email">Email</label>
    <input id="k-email" name="email" type="email" autocomplete="username" required>
    <label for="k-password">Password</label>
    <input id="k-password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <div data-error aria-live="polite"></div>
    <p class="k-switch" data-signup-link hidden>New here? <a href="#" data-to="signup">Create an account</a></p>
  </form>
</template>
<template id="signup">
  <form class="k-login" autocomplete="on">
    <h1>Create an account</h1>
    <p>For facilitators and organisations. Artisans do not need one — they use the link you give them.</p>
    <label for="k-org">Organisation</label>
    <input id="k-org" name="org" autocomplete="organization" required>
    <label for="k-name">Your name</label>
    <input id="k-name" name="name" autocomplete="name" required>
    <label for="k-email2">Email</label>
    <input id="k-email2" name="email" type="email" autocomplete="username" required>
    <label for="k-password2">Password (10+ characters)</label>
    <input id="k-password2" name="password" type="password" autocomplete="new-password" minlength="10" required>
    <div data-code hidden>
      <label for="k-code">Sign-up code</label>
      <input id="k-code" name="code" autocomplete="off">
    </div>
    <button type="submit">Create account</button>
    <div data-error aria-live="polite"></div>
    <p class="k-switch">Already have an account? <a href="#" data-to="login">Sign in</a></p>
  </form>
</template>
<script type="module" src="/runtime.js"></script>
</body>
</html>
