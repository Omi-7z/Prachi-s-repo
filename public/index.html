<script>
  // The organisation console used to live at "/". Old bookmarks and home-screen icons
  // ("/?src=a2hs", "/?org=…", "/#…") keep working: anything the website itself does not
  // use goes to /console with the same query and hash. vercel.json redirects the known
  // query keys on the server; this catches the rest, and hashes, which never reach it.
  (function () {
    var q = location.search.slice(1).split('&').filter(function (kv) { return kv && !/^(utm_[a-z]+|fbclid|gclid)=/.test(kv); });
    var h = location.hash;
    if (q.length || (h && h !== '#' && h.indexOf('#/') !== 0)) location.replace('/console' + location.search + h);
  })();
</script>
