<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karigar · Organisation</title>
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<link rel="icon" href="/karigar-logo.svg" type="image/svg+xml">
<link rel="icon" href="/icons/karigar-192.png" type="image/png">
<link rel="modulepreload" href="/vendor/preact.mjs">
<style>
  body { margin: 0; background: #ffffff; color: #10292d; font-family: "Instrument Sans", system-ui, 'Noto Sans Devanagari', 'Noto Sans Gujarati', 'Noto Sans Bengali', 'Noto Sans Tamil', 'Noto Sans Kannada', sans-serif; }
  .k-boot { max-width: 30rem; margin: 18vh auto 0; padding: 0 20px; text-align: center; }
  .k-boot h1 { font-size: 24px; font-weight: 600; margin: 0 0 10px; }
  .k-boot p { font-size: 16px; line-height: 1.6; color: #5f6b69; margin: 0; }
  .k-signin { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); min-height: 100vh; }
  .k-signin-side { position: relative; padding-top: clamp(72px,8vw,96px) !important; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: clamp(24px,5vw,64px); background: #ffffff; }
  .k-login { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 18px; }
  .k-login h2 { margin: 0; font-weight: 500; font-size: 32px; letter-spacing: -.03em; }
  .k-login .k-lead { margin: -12px 0 0; font-size: 15px; line-height: 1.5; color: #5f6b69; }
  .k-sf { display: flex; flex-direction: column; gap: 6px; }
  .k-sf[hidden] { display: none; }
  .k-sf label { font-size: 14px; font-weight: 600; color: #10292d; }
  .k-sf small { font-size: 13px; line-height: 1.5; color: #75817e; }
  .k-sf input { width: 100%; box-sizing: border-box; padding: 14px 16px; border-radius: 14px; border: 1px solid #d5d3c8; background: #f9f8f4; font: inherit; font-size: 16px; color: #10292d; outline: none; }
  .k-sf input:focus { border-color: #10292d; box-shadow: 0 0 0 4px #ebe9fb; }
  .k-primary { padding: 15px 24px; border-radius: 999px; border: 0; background: #10292d; color: #f5f4ee; font: inherit; font-weight: 500; font-size: 16px; cursor: pointer; min-height: 52px; }
  .k-primary:disabled { opacity: .6; }
  .k-or { display: flex; align-items: center; gap: 12px; color: #75817e; font-size: 13px; }
  .k-or::before, .k-or::after { content: ""; flex: 1; height: 1px; background: #e2e0d6; }
  .k-secondary { display: block; box-sizing: border-box; text-align: center; padding: 14px 22px; border-radius: 999px; border: 1px solid #e2e0d6; background: #ffffff; color: #10292d; font-weight: 500; font-size: 15.5px; min-height: 50px; text-decoration: none; }
  .k-note { margin: 0; font-size: 13px; line-height: 1.5; color: #75817e; }
  .k-note[hidden] { display: none; }
  .k-note a { color: #10292d; font-weight: 600; }
  .k-login [data-error] { color: #a3443d; font-size: 14px; }
  .k-login [data-error]:empty { display: none; }
  .k-back { position: absolute; top: clamp(16px,2.5vw,28px); right: clamp(16px,2.5vw,28px); display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: #10292d; text-decoration: none; padding: 9px 14px; border-radius: 999px; border: 1px solid #e2e0d6; background: #ffffff; min-height: 40px; box-sizing: border-box; }
  .k-home { width: 100%; max-width: 420px; font-size: 13.5px; font-weight: 500; color: #5f6b69; text-decoration: none; }
  @media (max-width: 860px) {
    .k-signin { grid-template-columns: minmax(0,1fr); }
    .k-signin-art { min-height: 240px; }
  }
</style>
</head>
<body data-mode="console">
<div id="app"><div class="k-boot"><p>Karigar</p></div></div>

        <div style="display:flex;flex-direction:column;justify-content:center;gap:clamp(24px,4vh,40px);min-width:0">
          <svg viewBox="0 0 24 24" aria-hidden="true" style="width:clamp(120px,14vw,188px);height:auto;aspect-ratio:1;display:block"><path d="M16.10 2.38A10.8 10.8 0 1 0 17.55 20.74" fill="none" stroke="#F0B23C" stroke-width="0.82" stroke-linecap="round"></path><path d="M17.47 4.79A9.55 9.55 0 1 0 18.30 18.39" fill="none" stroke="#5B8AB5" stroke-width="0.82" stroke-linecap="round"></path><path d="M17.21 6.20A8.35 8.35 0 1 0 17.96 16.91" fill="none" stroke="#DC5A3C" stroke-width="0.82" stroke-linecap="round"></path><path d="M16.80 7.47A7.2 7.2 0 1 0 17.37 15.71" fill="none" stroke="#C2475E" stroke-width="0.82" stroke-linecap="round"></path><path d="M16.22 8.62A6.05 6.05 0 1 0 16.49 14.93" fill="none" stroke="#9BC7A8" stroke-width="0.82" stroke-linecap="round"></path><path d="M15.60 9.85A4.9 4.9 0 1 0 15.57 14.22" fill="none" stroke="#D9C4E4" stroke-width="0.82" stroke-linecap="round"></path><circle cx="18.14" cy="3.73" r="0.87" fill="#F0B23C"></circle><circle cx="19.55" cy="5.14" r="0.83" fill="#F0B23C"></circle><circle cx="20.66" cy="6.80" r="0.78" fill="#F0B23C"></circle><circle cx="21.46" cy="8.63" r="0.72" fill="#F0B23C"></circle><circle cx="21.91" cy="10.57" r="0.68" fill="#F0B23C"></circle><circle cx="21.99" cy="12.57" r="0.64" fill="#F0B23C"></circle><circle cx="21.70" cy="14.54" r="0.59" fill="#F0B23C"></circle><circle cx="21.05" cy="16.43" r="0.55" fill="#F0B23C"></circle><circle cx="20.07" cy="18.16" r="0.49" fill="#F0B23C"></circle><circle cx="18.78" cy="19.69" r="0.45" fill="#F0B23C"></circle></svg>
          <div style="display:flex;flex-direction:column;gap:16px"><h1 style="margin:0;font-family:'Instrument Sans', sans-serif;font-weight:500;font-size:clamp(34px,4vw,56px);line-height:1.02;letter-spacing:-.035em;text-wrap:balance"><span style="display:block;font-family:'Instrument Sans', sans-serif;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#93aaa6;margin-bottom:14px">Organisation console</span>Every story stays <em style="font-family:'Newsreader', Georgia, serif;font-weight:400;color:#d9c98a">with its maker.</em></h1><p style="margin:0;font-size:17px;line-height:1.6;color:#b9c8c4;max-width:42ch;text-wrap:pretty">Sign in to run sessions, follow each artisan’s board and answer partner requests.</p></div>
        </div>
        <figure style="margin:0;max-width:44ch;padding-top:20px;border-top:1px solid rgba(238,242,236,.16);display:flex;flex-direction:column;gap:8px"><blockquote style="margin:0;font-family:'Newsreader', Georgia, serif;font-size:20px;line-height:1.45;color:#eef2ec">“Now the women correct the drafts before anything goes out.”</blockquote><figcaption style="font-size:14px;color:#93aaa6">Meera Joshi · Field coordinator</figcaption></figure>
      </div>
    <div class="k-signin-side">
      <a class="k-back" href="/">← Back to website</a>
      <div data-slot style="display:contents"></div>
    </div>
  </div>
</template>
<template id="login">
  <form class="k-login" autocomplete="on">
    <h2>Sign in</h2>
    <p class="k-lead">Use the account your coordinator set up.</p>
    <div class="k-sf"><label for="k-email">Work email or username</label><input id="k-email" name="email" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="you@organisation.org" required></div>
    <div class="k-sf"><label for="k-password">Password</label><input id="k-password" name="password" type="password" autocomplete="current-password" required><small>Forgot it? Ask your coordinator.</small></div>
    <div data-error role="alert"></div>
    <button class="k-primary" type="submit">Sign in to the console</button>
    <div class="k-or">or</div>
    <a class="k-secondary" href="/app">I’m an artisan · open the app</a>
    <p class="k-note">New organisation? <a href="/#/organisations">Request a pilot</a>.</p>
    <p class="k-note" data-signup-link hidden>New here? <a href="#" data-to="signup">Create an account</a>.</p>
  </form>
</template>
<template id="signup">
  <form class="k-login" autocomplete="on">
    <h2>Create an account</h2>
    <p class="k-lead">For facilitators and organisations. Artisans do not need one — they use the link you give them.</p>
    <div class="k-sf"><label for="k-org">Organisation</label><input id="k-org" name="org" autocomplete="organization" required></div>
    <div class="k-sf"><label for="k-name">Your name</label><input id="k-name" name="name" autocomplete="name" required></div>
    <div class="k-sf"><label for="k-email2">Work email</label><input id="k-email2" name="email" type="email" autocomplete="username" required></div>
    <div class="k-sf"><label for="k-password2">Password (10+ characters)</label><input id="k-password2" name="password" type="password" autocomplete="new-password" minlength="10" required></div>
    <div class="k-sf" data-code hidden><label for="k-code">Sign-up code</label><input id="k-code" name="code" autocomplete="off"></div>
    <div data-error role="alert"></div>
    <button class="k-primary" type="submit">Create account</button>
    <p class="k-note">Already have an account? <a href="#" data-to="login">Sign in</a>.</p>
  </form>
</template>
<script type="module" src="/runtime.js?v=__KARIGAR_BUILD__"></script>
</body>
</html>
